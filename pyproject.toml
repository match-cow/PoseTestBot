[project]
name = "posetestbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.11.0.86",
    "pyrealsense2>=2.55.1.6486",
    "requests>=2.32.4",
    "flask>=2.0.0",
    "depthai>=3,<4",
    "tqdm>=4.67.1",
    "pytransform3d>=3.14.1",
    "pandas>=2.3.0",
    "trimesh>=4.12.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = [
    "evaluation*",
    "iiwa*",
    "object_models*",
    "output*",
    "scripts*",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
